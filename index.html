<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#5AB8FF">
<title>Momo 学英文·国文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDF0FF; --dot:#C3E2FB; --surface:#FFFFFF; --ink:#2A2F6B; --muted:#6B70A8; --edge:#2A2F6B;
  --sun:#FFD23F; --pink:#FF8FB1; --mint:#6FD6A8; --sky:#5AB8FF; --line:#C9E2F7;
  --good:#2FB36E; --bad:#FF6B6B; --soft:#F2F8FF;
  /* skin shape tokens: border width, button/panel radius, shadows, press motion, page paper, font */
  --bw:3px; --rb:18px; --rp:28px; --shb:0 5px 0 var(--edge); --shpress:0 1px 0 var(--edge); --press:translateY(4px); --shp:none;
  --paper:radial-gradient(var(--dot) 2px, transparent 2.5px) 0 0/28px 28px, var(--bg);
  --font:"Baloo 2","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1F45; --dot:#252A5A; --surface:#272C5E; --ink:#F3F4FF; --muted:#AEB3E8; --edge:#8C92E8;
    --line:#3A407A; --soft:#22275A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1F45; --dot:#252A5A; --surface:#272C5E; --ink:#F3F4FF; --muted:#AEB3E8; --edge:#8C92E8;
  --line:#3A407A; --soft:#22275A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--paper);background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font);
  font-size:18px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
#app{max-width:980px;margin:0 auto;padding:16px 18px 40px}
h1,h2,h3{margin:0;line-height:1.15}
.zh{color:var(--muted)}
.hide{display:none!important}

/* toy-block buttons: the signature element */
.btn{
  font-weight:700;border:var(--bw) solid var(--edge);border-radius:var(--rb);background:var(--surface);color:var(--ink);
  padding:10px 18px;box-shadow:var(--shb);cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  min-height:52px;
}
.btn:active{transform:var(--press);box-shadow:var(--shpress)}
.btn:focus-visible,.opt:focus-visible,.topic:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.btn.sun{background:var(--sun);color:#2A2F6B}
.btn.pink{background:var(--pink);color:#2A2F6B}
.btn.mint{background:var(--mint);color:#2A2F6B}
.btn.sky{background:var(--sky);color:#fff}
.btn.big{font-size:24px;padding:14px 28px;min-height:66px}
.btn.round{border-radius:50%;width:58px;height:58px;padding:0;font-size:26px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.who{background:none;border:0;cursor:pointer;padding:0;text-align:left;display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:800;font-size:22px}
.ava{width:52px;height:52px;border-radius:50%;background:var(--surface);border:3px solid var(--edge);display:grid;place-items:center;font-size:30px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#2A2F6B;border:3px solid var(--edge);border-radius:999px;padding:4px 14px;font-weight:800}
.tabs{display:flex;gap:8px}
.tabs .btn{min-height:48px;padding:6px 14px}
.tabs .btn.on{background:var(--sky);color:#fff}

/* panels */
.panel{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--rp);box-shadow:var(--shp);padding:18px 20px;margin-bottom:18px}
.hello{display:flex;align-items:center;gap:16px}
.bubble{position:relative;background:var(--soft);border-radius:22px;padding:12px 18px;font-size:20px;font-weight:700;flex:1}
.bubble small{display:block;font-weight:500;font-size:16px;color:var(--muted)}
.today{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.seg{display:inline-flex;border:3px solid var(--edge);border-radius:20px;overflow:hidden;background:var(--surface)}
.seg{flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:10px 14px;font-weight:700;cursor:pointer;min-height:52px}
.seg button.on{background:var(--mint);color:#2A2F6B}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.topic{
  border:var(--bw) solid var(--edge);border-radius:var(--rp);padding:16px 14px 14px;text-align:left;cursor:pointer;
  box-shadow:var(--shb);color:#2A2F6B;transition:transform .08s, box-shadow .08s;position:relative;
}
.topic:active{transform:var(--press);box-shadow:var(--shpress)}
.topic .ic{font-size:52px;line-height:1}
.topic h3{font-size:24px;margin-top:6px}
.topic .t2{font-size:16px;opacity:.8}
.meter{height:12px;border-radius:99px;background:rgba(42,47,107,.15);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:#2A2F6B;border-radius:99px}
.topic .cnt{font-size:14px;font-weight:700;margin-top:4px}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px 18px;border-radius:24px}
.mode .e{font-size:40px}
.mode b{font-size:22px}
.mode span{font-size:15px;font-weight:500;color:var(--muted)}

/* game */
.gbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--edge);background:var(--surface)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--sun)} .dots i.now{background:var(--sky)}
.stage{text-align:center}
.prompt{font-size:120px;line-height:1.1;margin:6px 0}
.word{font-size:46px;font-weight:800;letter-spacing:.5px}
.helpzh{font-size:26px;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px;margin:18px auto 0}
.opt{
  background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--rp);box-shadow:var(--shb);
  padding:14px;cursor:pointer;min-height:110px;display:grid;place-items:center;font-weight:800;font-size:30px;
  transition:transform .08s, box-shadow .08s;
}
.opt.emo{font-size:72px}
.opt:active{transform:var(--press);box-shadow:var(--shpress)}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;opacity:.6;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.feedback{margin:18px auto 0;max-width:640px;background:var(--soft);border:3px dashed var(--line);border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left}
.feedback .ft{flex:1;font-size:20px;font-weight:700}
.feedback .ft small{display:block;font-weight:500;color:var(--muted);font-size:17px}

.card{max-width:520px;margin:0 auto;background:var(--surface);border:3px solid var(--edge);border-radius:34px;box-shadow:0 8px 0 var(--edge);padding:24px;cursor:pointer}
.card .other{font-size:20px;color:var(--muted);margin-top:4px}

.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{width:54px;height:62px;border-radius:14px;border:3px dashed var(--edge);display:grid;place-items:center;font-size:32px;font-weight:800;background:var(--soft);cursor:pointer}
.slot.f{background:var(--sun);border-style:solid;color:#2A2F6B}
.slot.gap{border:0;background:transparent;width:20px;cursor:default}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;max-width:700px;margin:0 auto}
.tile{width:60px;height:64px;font-size:32px;padding:0;border-radius:16px;background:var(--pink);color:#2A2F6B}
.tile.used{visibility:hidden}
.feats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.feat{flex-direction:column;min-height:118px;border-radius:24px;gap:0}
.feat .fe{font-size:40px;line-height:1.15}.feat b{font-size:19px}.feat .fs{font-size:13px;font-weight:500;color:var(--muted)}
@media (max-width:640px){.feats{grid-template-columns:repeat(2,1fr)}}
.map{display:flex;flex-direction:column;gap:10px}
.region{border-radius:18px;padding:8px 16px;font-weight:800;font-size:20px;color:#2A2F6B;margin:8px 0 2px}
.stn{display:flex;align-items:center;gap:14px}
.node{width:76px;height:76px;border-radius:50%;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);font-size:36px;background:var(--surface);cursor:pointer;flex:none}
.stn.done .node{background:var(--sun)}.stn.now .node{background:var(--sky);animation:pulse2 1.2s ease-in-out infinite}.stn.lock .node{background:var(--soft)}
.stn.boss .node{width:92px;height:92px;font-size:46px;border-radius:28px}
@keyframes pulse2{50%{transform:scale(1.1)}}
.sl{display:flex;flex-direction:column;min-width:0}.sl b{font-size:19px}.sl span{font-size:14px;color:var(--muted)}.stn.lock .sl{opacity:.55}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.pcard{border:3px solid var(--edge);border-radius:18px;background:linear-gradient(160deg,#FFF6D6,#FFE0EC);color:#2A2F6B;box-shadow:0 5px 0 var(--edge);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;text-align:center}
.pcard .pe{font-size:46px;line-height:1.15}.pcard b{font-size:17px}.pcard span{font-size:14px}.pcard .zh{color:#6B70A8}
.pcard.off{background:var(--soft);color:var(--muted);cursor:default;box-shadow:none}.pcard.off .pe{filter:grayscale(1) brightness(.3);opacity:.3}
.pcard.trophy{background:linear-gradient(160deg,#FFE07A,#FFB547)}.pcard.trophy.off{background:var(--soft)}
.mission.ok{opacity:.7}
.chip.onc{background:var(--sun);color:#2A2F6B}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.dside{border:3px solid var(--edge);border-radius:24px;padding:12px;color:#2A2F6B}
.dside.p0{background:#DFF4FF}.dside.p1{background:#FFE6EE}
.dhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:22px;margin-bottom:10px}
.dsc{margin-left:auto;background:var(--sun);border:3px solid #2A2F6B;border-radius:99px;padding:0 14px;font-size:26px}
.dopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dopts .opt{min-height:84px;font-size:22px;color:var(--ink)}
.opt.locked{opacity:.4}
.dwin,.dno{text-align:center;font-weight:800;font-size:20px;margin-top:8px}
@media (max-width:640px){.duel{grid-template-columns:1fr}}
.rest{position:fixed;inset:0;background:rgba(27,31,69,.7);display:grid;place-items:center;z-index:80;padding:20px}
@media (prefers-reduced-motion: reduce){.stn.now .node{animation:none}}
.momo{position:relative;display:inline-block;flex:none;line-height:1;vertical-align:middle}
.momo svg{display:block}
.acc{position:absolute;line-height:1;pointer-events:none}
.a-hat{font-size:.44em;left:50%;top:-24%;transform:translateX(-50%)}
.a-ear{font-size:.26em;left:70%;top:2%}
.a-face{font-size:.40em;left:50%;top:31%;transform:translateX(-50%)}
.a-hand{font-size:.34em;right:-16%;bottom:-2%}
.momobtn{background:none;border:0;padding:0;cursor:pointer;position:relative;z-index:1;flex:none}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.dance{animation:dance .5s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-6px)}}
.combo{display:inline-block;background:var(--pink);color:#2A2F6B;border-radius:99px;padding:0 10px;font-size:16px;margin:0 6px 2px 0;animation:pulse .5s}
@keyframes pulse{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.room{position:relative;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;overflow:hidden}
.deco span{position:absolute;font-size:46px;opacity:.9}
.petsay{flex:none;max-width:440px;text-align:center;position:relative;z-index:1;background:var(--surface)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.item{border:var(--bw) solid var(--edge);border-radius:var(--rb);background:var(--surface);color:var(--ink);box-shadow:var(--shb);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s,box-shadow .08s}
.item:active{transform:var(--press);box-shadow:var(--shpress)}
.item span{font-size:38px;line-height:1.1}.item small{font-size:13px;font-weight:700}
.item.on{background:var(--mint);color:#2A2F6B}.item.lock span{filter:grayscale(.5);opacity:.75}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:720px;margin:0 auto}
.mcard{aspect-ratio:3/4;border:var(--bw) solid var(--edge);border-radius:var(--rb);box-shadow:var(--shb);background:var(--sky);cursor:pointer;display:grid;place-items:center;padding:6px}
.mcard.up{background:var(--surface);animation:flip .25s ease-out}
.mcard.done{background:var(--mint);animation:none}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:rotateY(0)}}
.mcard .ce{font-size:54px}.mcard .ct{font-size:22px;font-weight:800;color:var(--ink);word-break:break-word;line-height:1.15}.mcard.done .ct{color:#2A2F6B}.mcard .cb{font-size:40px;opacity:.9}
.pond{position:relative;height:440px;max-width:720px;margin:10px auto 0;border-radius:28px;background:linear-gradient(#CFEFFF,#7CC8F5);border:3px solid var(--edge);overflow:hidden}
.bub{position:absolute;bottom:-130px;width:128px;height:128px;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.98),rgba(255,255,255,.5) 38%,rgba(150,205,255,.45));color:#2A2F6B;font-weight:800;font-size:22px;display:grid;place-items:center;padding:10px;cursor:pointer;animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite;box-shadow:0 6px 14px rgba(42,47,107,.12);word-break:break-word;line-height:1.1}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(10px,-150px)}50%{transform:translate(-8px,-300px)}75%{transform:translate(8px,-450px)}100%{transform:translate(0,-600px)}}
.bub.popx{visibility:hidden}
@media (max-width:560px){.cards{grid-template-columns:repeat(3,1fr)}.mcard .ce{font-size:40px}.mcard .ct{font-size:17px}.bub{width:96px;height:96px;font-size:17px}.pond{height:400px}}
@media (prefers-reduced-motion: reduce){.bob,.dance,.combo,.mcard.up{animation:none}.bub{animation:none!important;bottom:auto;top:var(--y)}}
.obs{display:inline-block;line-height:1.25;max-width:560px}
.ob{position:relative;display:inline-block;font-size:40px;margin:2px}
.ob i{position:absolute;top:-6px;right:-8px;font-style:normal;font-size:13px;font-weight:800;background:var(--sun);color:#2A2F6B;border:2px solid #2A2F6B;border-radius:99px;min-width:24px;height:24px;line-height:20px;text-align:center}
.ob.x{opacity:.4}.ob.x::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;color:var(--bad);font-size:44px;font-weight:800}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.sym{font-size:52px;font-weight:800}
.mq{font-size:42px;font-weight:800;margin:4px 0}
.mview{min-height:70px;margin:8px auto;max-width:760px}
.opts.wide .opt{min-height:170px;font-size:inherit}
.opt .ob{font-size:28px}
.opts.wide .ob{font-size:38px}
.opt small{font-size:16px;display:block;font-weight:700;line-height:1.2}
.opt.emo small{font-size:17px}
.opts.wide .opt span{font-size:56px;line-height:1.1}
.opts.wide .opt small{font-size:22px}
.sitem{display:inline-flex;flex-direction:column;align-items:center;background:var(--surface);border:3px solid var(--edge);border-radius:24px;padding:10px 26px}
.se{font-size:84px;line-height:1.1}
.st{font-size:24px;font-weight:800}
.frame{display:inline-grid;grid-template-columns:repeat(5,58px);gap:6px;background:var(--surface);border:3px solid var(--edge);border-radius:16px;padding:8px}
.frame b{width:58px;height:58px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:30px}
.frame b.on{background:#FFE3EC}
.fn{font-size:22px;font-weight:800;color:var(--muted)}
.nbox{display:inline-grid;place-items:center;min-width:64px;height:64px;padding:0 8px;border:3px solid var(--edge);border-radius:16px;background:var(--surface);font-size:30px;font-weight:800;margin:4px;vertical-align:middle}
.nbox.q{background:var(--sun);color:#2A2F6B}
.nbox.sm{min-width:46px;height:46px;font-size:20px}
.step{font-size:16px;color:var(--good);font-weight:800;vertical-align:middle}
.note{display:inline-grid;place-items:center;width:110px;height:58px;border-radius:10px;border:3px solid #2A2F6B;color:#fff;font-weight:800;font-size:24px;margin:6px;box-shadow:inset 0 0 0 4px rgba(255,255,255,.35)}
.note.n1{background:#3B6FD8}.note.n5{background:#2E9E5B}.note.n10{background:#D9534F}
.coin{display:inline-grid;place-items:center;align-content:center;width:76px;height:76px;border-radius:50%;border:3px solid #2A2F6B;background:radial-gradient(circle at 35% 35%,#fff,#BFC5D2);color:#2A2F6B;font-weight:800;font-size:26px;line-height:1;margin:6px}
.coin small{font-size:13px}
.hintbox{margin:8px 0;font-size:19px;font-weight:700;color:var(--muted)}
@media (max-width:560px){.frame{grid-template-columns:repeat(5,46px)}.frame b{width:46px;height:46px}.ob{font-size:32px}.mq{font-size:34px}}
.vsel{flex:1;min-width:180px;max-width:100%;font-size:16px;font-weight:700;border:3px solid var(--edge);border-radius:14px;padding:10px;background:var(--surface);color:var(--ink);min-height:52px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px}
.kid{flex-direction:column;min-height:160px;border-radius:26px;text-align:center}
.kid .ke{font-size:52px;line-height:1}
.kid span{font-weight:500}
.slot.wd{width:auto;min-width:76px;padding:0 12px;font-size:26px}
.tile.wd{width:auto;padding:0 18px;font-size:26px;background:var(--mint)}
.tag{white-space:nowrap;display:inline-block;font-size:12px;font-weight:700;background:rgba(255,255,255,.65);color:#2A2F6B;border-radius:99px;padding:1px 9px;margin-top:6px}

/* growth */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stat{background:var(--soft);border-radius:22px;padding:14px;text-align:center}
.stat .n{font-size:38px;font-weight:800;line-height:1.1}
.stat .l{font-size:15px;color:var(--muted)}
.lvl{display:flex;align-items:center;gap:16px}
.lvl .big{font-size:64px}
.bars2{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center}
.bars2 .m2{display:flex;flex-direction:column;gap:4px}
.mrow{display:flex;align-items:center;gap:8px;font-size:14px}
.mrow .meter{flex:1;margin:0;background:var(--soft)}
.mrow .meter i.en{background:var(--sky)} .mrow .meter i.ms{background:var(--mint)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}
.sticker{background:var(--soft);border-radius:20px;padding:10px 6px;text-align:center;font-size:14px}
.sticker .e{font-size:44px;display:block}
.sticker.lock .e{filter:grayscale(1);opacity:.25}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:2px dashed var(--line);font-size:16px}
.list li:last-child{border-bottom:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--edge);border-radius:999px;background:var(--surface);padding:6px 14px;cursor:pointer;font-weight:700;min-height:48px}
h2{font-size:26px;margin-bottom:12px}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .b{fill:var(--sky)} .chart .bt{fill:var(--sun)} .chart .gl{stroke:var(--pink);stroke-dasharray:5 5;stroke-width:2}

.setup{text-align:center;max-width:620px;margin:20px auto}
.setup input{width:100%;font-size:28px;font-weight:700;text-align:center;border:3px solid var(--edge);border-radius:20px;padding:12px;background:var(--surface);margin:12px 0;user-select:text;-webkit-user-select:text}
.avas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 20px}
.avas button{font-size:40px;width:72px;height:72px;border-radius:50%;border:3px solid var(--edge);background:var(--surface);cursor:pointer}
.avas button.on{background:var(--sun);transform:scale(1.08)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-weight:700;z-index:50;max-width:90vw;text-align:center}
.pop{position:fixed;pointer-events:none;font-size:34px;z-index:60;animation:pop 1s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) scale(.6);opacity:1}to{transform:translate(var(--dx),-160px) scale(1.2);opacity:0}}
.wiggle{animation:wig 1.2s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@media (prefers-reduced-motion: reduce){.pop,.wiggle,.shake{animation:none}.pop{display:none}}
@media (max-width:560px){.prompt{font-size:90px}.word{font-size:36px}.opt.emo{font-size:56px}.opt{font-size:24px;min-height:92px}.slot{width:42px;height:52px;font-size:26px}.tile{width:50px;height:56px;font-size:26px}}

let cloudRef=null,cloudTimer=null,cloudBusy=false,cloudAgain=false,cloudOn=false;
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  try{
    const db=await window.claude.use('db');const user=await window.claude.use('user');
    if(!db||!user)return;const id=await user.id();if(!id)return;
    cloudRef=db.collection('data/users/'+id).doc('progress');
    const snap=await cloudRef.get();cloudOn=true;
    if(snap.exists){const d=snap.data();if(d&&typeof d.state==='string'){const remote=normalize(JSON.parse(d.state));
      if((remote.updatedAt||0)>(ALL.updatedAt||0)){ALL=remote;S=ALL.kids[ALL.cur];saveLocal();if(view.name!=='game')render()}
      else if((ALL.updatedAt||0)>(remote.updatedAt||0))queueCloud()}}
    else if(S.name)queueCloud();
    if(view.name==='settings')render();
  }catch(e){}
}
function queueCloud(){if(!cloudRef)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,1500)}
async function pushCloud(){if(!cloudRef)return;if(cloudBusy){cloudAgain=true;return}cloudBusy=true;
  try{await cloudRef.set({state:JSON.stringify(ALL),updatedAt:ALL.updatedAt})}catch(e){}
  cloudBusy=false;if(cloudAgain){cloudAgain=false;pushCloud()}}

const PREF={en:['en-gb','en-us','en'],ms:['ms-my','ms','id-id','id'],zh:['zh-cn','zh-sg','zh-my','zh-tw','zh']};
const vlang=v=>v.lang.replace('_','-').toLowerCase();
function voicesFor(l){const pf=l==='ms'?['ms','id']:[l];return voices.filter(v=>pf.some(p=>vlang(v).startsWith(p)))}
function pickVoice(l){if(VP[l]){const v=voices.find(x=>x.voiceURI===VP[l]);if(v)return v}for(const p of PREF[l]){const v=voices.find(x=>vlang(x).startsWith(p));if(v)return v}return null}

function speak(text,lang,queue){
  if(!('speechSynthesis' in window))return;
  try{if(!queue)speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);
    const v=pickVoice(lang);
    if(v){u.voice=v;u.lang=v.lang}else u.lang=PREF[lang][0];
    u.rate=(lang==='zh'?0.9:0.78)*VP.rate;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}
}
let actx;
function tone(fs,dur,type){if(!S.sound)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t+i*dur);g.gain.exponentialRampToValueAtTime(0.22,t+i*dur+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*dur+dur);
  o.connect(g).connect(actx.destination);o.start(t+i*dur);o.stop(t+i*dur+dur+0.03)})}catch(e){}}

let rec=null,recChunks=[],recUrl=null,recState='idle',recTimer=null;

async function toggleRec(){
  if(recState==='rec'){stopRec();return}
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder)throw new Error('no');
    try{speechSynthesis.cancel()}catch(e){}
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    recChunks=[];rec=new MediaRecorder(stream);
    rec.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
    rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(recChunks,{type:rec.mimeType||'audio/mp4'});
      if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(blob);recState='done';const d=dayRec();d.rec=(d.rec||0)+1;touch();
      if(view.name==='game')render();playMine()};
    rec.start();recState='rec';render();recTimer=setTimeout(stopRec,4000);
  }catch(e){recState='idle';render();toast('这台设备暂时不能录音，请允许使用麦克风 🎤')}
}

function adv(){return S.adv||(S.adv={done:{}})}
function advNext(){let i=0;while(i<STATIONS.length&&adv().done[i])i++;return i}
function stLabel(st){if(st.k==='word'){const t=T(st.topic);return{e:t.icon,t:t.zh+' · '+MODES[st.mode].zh,s:LANGS[st.lang].flag+' '+LANGS[st.lang].zh}}
  if(st.k==='math'){const g=MG[st.game]||SG[st.game];return{e:g.e,t:g.zh,s:MG[st.game]?'🔢 数学':'🔬 科学'}}return{e:'👹',t:'大魔王',s:'综合挑战 · 答对 6 题过关'}}
function startStation(idx){if(overLimit()){showRest();return}const st=STATIONS[idx];
  if(st.k==='word'){view.topic=st.topic;startGame(st.mode,st.topic,st.lang)}else if(st.k==='math')startMath(st.game,st.level);else startBoss(idx);
  if(G)G.station=idx}
function startBoss(idx){const st=STATIONS[idx];const qs=[];
  st.words.forEach(tid=>{const pool=T(tid).words;shuffle(pool).slice(0,2).forEach(w=>qs.push({w,m:pick(['read','listen']),opts:shuffle([w,...shuffle(pool.filter(x=>x!==w)).slice(0,3)]),missed:false,hinted:false,done:false,wrongIdx:[]}))});
  st.games.forEach(g=>{const gm=MG[g]||SG[g];for(let k=0;k<2;k++)qs.push(Object.assign(gm.gen(1),{m:'math',g,missed:false,hinted:false,done:false,hint:false,wrongIdx:[]}))});
  resetRec();G={topic:'boss:'+idx,mode:'boss',lang:st.lang,i:0,score:0,combo:0,best:0,start:Date.now(),starsBefore:S.stars,cardsBefore:cardCount(),qs:shuffle(qs),station:idx};
  go({name:'game'});setTimeout(()=>{const m=cur().m;if(m==='listen'||m==='math')speakCur()},350)}
function vMap(){const nx=advNext();let html='',lastR=-1;
  STATIONS.forEach((st,i)=>{if(st.r!==lastR){lastR=st.r;const R=REGIONS[st.r];html+=`<div class="region" style="background:${R.bg}">${R.e} 第 ${st.r+1} 区：${R.zh}</div>`}
    const L=stLabel(st),state=adv().done[i]?'done':i===nx?'now':'lock';
    html+=`<div class="stn ${state} ${st.k==='boss'?'boss':''}" style="margin-left:${[0,56,96,56][i%4]}px"><button class="node" data-act="${state==='lock'?'locked':'station'}" data-v="${i}" aria-label="第 ${i+1} 站 ${L.t}">${state==='lock'?'🔒':L.e}</button><div class="sl"><b>${L.t}</b><span>${state==='done'?'⭐ 已过关（可以再玩）':state==='now'?'👉 '+L.s:L.s}</span></div></div>`});
  if(nx>=STATIONS.length)html+=`<div class="region" style="background:#FFE07A">🏆 全部通关！你是冒险大王！</div>`;

function answer(ok,el){
  const q=cur();if(q.done)return;const rect=el&&el.getBoundingClientRect?el.getBoundingClientRect():null;
  if(ok){q.done=true;const first=!q.missed&&!q.hinted;if(first){G.score++;G.combo=(G.combo||0)+1;G.best=Math.max(G.best||0,G.combo);q.m==='math'?recordMath(q.g||G.game,true):recordWord(q.w,true)}else G.combo=0;
    sGood();render();burst(rect||document.querySelector('.feedback'));setTimeout(speakCur,250);
    if(G.combo>=3){setTimeout(()=>burst(document.querySelector('.feedback .momo'),'🔥'),300);if([3,5,8].includes(G.combo)){const pr=PRAISE[G.combo%3];setTimeout(()=>speak(pr[0],pr[1],true),400)}}}
  else{G.combo=0;if(!q.missed){q.missed=true;q.m==='math'?recordMath(q.g||G.game,false):recordWord(q.w,false)}sBad()}
}
function spellCheck(){
  const q=cur();if(q.slots.some(s=>!s.fixed&&!s.val))return;
  const ok=q.slots.every(s=>s.fixed||s.val===s.ch);
  if(ok)answer(true,document.getElementById('slots'));
  else{answer(false);const el=document.getElementById('slots');el.classList.add('shake');
    setTimeout(()=>{q.slots.forEach(s=>{if(!s.fixed&&s.val!==s.ch&&s.tile!=null){q.tiles.find(t=>t.id===s.tile).used=false;s.val=null;s.tile=null}});render()},450)}
}
function endGame(){
  const mins=Math.max(1,Math.round((Date.now()-G.start)/60000));
  if(G.mode==='learn'){addStars(3)}
  if(G.mode==='match'){addStars(G.moves<=8?6:G.moves<=11?5:G.moves<=14?4:3)}
  dayRec().mins+=mins;
  let pass=null;if(G.station!=null){pass=G.mode==='learn'||G.mode==='match'||G.score>=Math.ceil(G.qs.length*0.75);if(pass){const first=!adv().done[G.station];adv().done[G.station]=true;if(STATIONS[G.station].k==='boss'&&first)addStars(5)}}
  S.sessions.push({t:Date.now(),topic:G.topic,mode:G.mode,lang:G.lang,score:G.mode==='learn'?null:G.score,total:G.qs.length});
  S.sessions=S.sessions.slice(-60);touch();
  const earned=S.stars-G.starsBefore;const newSt=STICKERS.filter(s=>s.n>G.starsBefore&&s.n<=S.stars);
  go({name:'end',earned,newSt,mode:G.mode,score:G.score,total:G.qs.length,best:G.best||0,moves:G.moves||0,station:G.station,pass,newCards:cardCount()-(G.cardsBefore||0)});
  setTimeout(()=>{sGood();burst(document.querySelector('.endstar'),'🌟')},200);
}

/* ---------- growth ---------- */
function weekKeys(off){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)-7*off);const ks=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);ks.push(dk(x))}return ks}
function weekSum(off){const ks=weekKeys(off);const w={days:0,stars:0,mins:0,correct:0,wrong:0,rec:0,mc:0,sc:0,newWords:0,ks};
  ks.forEach(k=>{const r=S.days[k];if(r&&r.stars>0){w.days++;w.stars+=r.stars;w.mins+=r.mins||0;w.correct+=r.correct;w.wrong+=r.wrong;w.rec+=r.rec||0;w.mc+=r.mc||0;w.sc+=r.sc||0}});
  w.newWords=Object.values(S.words).filter(r=>r.m&&ks.includes(r.m)).length;return w}
function weakTopic(){let best=null;TOPICS.forEach(t=>{let tried=0;t.words.forEach(w=>{const r=wstat(S.lang,w);if(r.c+r.w)tried++});if(!tried)return;
  const ratio=mastered(S.lang,t.id)/t.words.length;if(ratio<1&&(!best||ratio<best.ratio))best={t,ratio}});return best&&best.t}
function fmtK(k){const p=k.split('-');return (+p[1])+'/'+(+p[2])}
function reportText(){const w=weekSum(0),lw=weekSum(1),wt=weakTopic();const acc=w.correct+w.wrong?Math.round(w.correct*100/(w.correct+w.wrong)):null;
  return `📋 ${S.name} 的本周学习报告（${fmtK(w.ks[0])}–${fmtK(w.ks[6])}）\n学习天数：${w.days} 天（上周 ${lw.days} 天）\n得到星星：${w.stars} 颗（上周 ${lw.stars} 颗）\n学习时间：约 ${w.mins} 分钟\n新学会的词：${w.newWords} 个\n第一次就答对：${acc==null?'–':acc+'%'}\n跟读次数：${w.rec} 次\n数学答对：${w.mc} 题\n科学答对：${w.sc} 题${wt?'\n下周多练：'+wt.zh+'（'+wt.en+' / '+wt.ms+'）':''}\n— Momo 学英文·国文`}
function cmp(a,b){return a>b?'<span style="color:var(--good)">▲</span>':a<b?'<span style="color:var(--bad)">▼</span>':''}

function chart(){
  const days=[];const d=new Date();d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){days.push({k:dk(d),day:d.getDate(),s:(S.days[dk(d)]||{}).stars||0});d.setDate(d.getDate()+1)}
  const max=Math.max(S.goal,...days.map(x=>x.s));const W=560,H=180,bw=W/14;
  const gy=H-20-(S.goal/max)*(H-40);
  return `<div style="overflow-x:auto"><svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px" role="img" aria-label="最近14天的星星">
    <line class="gl" x1="0" x2="${W}" y1="${gy}" y2="${gy}"/>
    ${days.map((x,i)=>{const h=(x.s/max)*(H-40);const isT=i===13;return `<rect class="${x.s>=S.goal?'bt':'b'}" x="${i*bw+6}" y="${H-20-h}" width="${bw-12}" height="${Math.max(h,0)}" rx="7"/>
      ${x.s?`<text x="${i*bw+bw/2}" y="${H-24-h}" text-anchor="middle">${x.s}</text>`:''}<text x="${i*bw+bw/2}" y="${H-4}" text-anchor="middle" style="${isT?'font-weight:800':''}">${isT?'今天':x.day}</text>`}).join('')}
  </svg></div><div class="zh" style="font-size:14px">黄色＝达到每日目标 ${S.goal} 颗星　粉色虚线＝目标线</div>`}

    <div style="font-weight:700">头像</div>
    <div class="avas" style="justify-content:flex-start">${AVAS.map(a=>`<button data-act="setava" data-v="${a}" class="${a===S.avatar?'on':''}" aria-label="头像 ${a}">${a}</button>`).join('')}</div>
    <div class="row" style="margin-bottom:12px"><b>每日目标</b>${[5,10,15,20].map(n=>`<button class="btn ${S.goal===n?'sky':''}" data-act="goal" data-v="${n}">${n} ⭐</button>`).join('')}</div>
    <div class="row" style="margin-bottom:12px"><b>每天时间提醒</b>${[0,15,20,30].map(n=>`<button class="btn ${S.limit===n?'sky':''}" data-act="limit" data-v="${n}">${n?n+' 分钟':'关'}</button>`).join('')}</div>
    <div class="row" style="margin-bottom:12px"><b>华文帮助</b><button class="btn ${S.showZh?'mint':''}" data-act="zh">${S.showZh?'开 ✓':'关'}</button>
      <b style="margin-left:12px">音效</b><button class="btn ${S.sound?'mint':''}" data-act="snd">${S.sound?'开 ✓':'关'}</button></div>
  </div>
  <div class="panel"><h2>画风皮肤 🎨</h2><div class="zh" style="font-size:14px;margin:-6px 0 10px">换一个喜欢的画风，整个 App 都会变样子</div>
    <div class="skins">${SKINS.map(([id,e,name])=>`<button class="skin ${S.skin===id?'on':''}" data-skin="${id}" data-act="skin" data-v="${id}" aria-pressed="${S.skin===id}" aria-label="画风 ${name}"><span class="sk-row">${panda(46,'happy')}<span class="sk-b">Aa</span></span><b>${e} ${name}</b></button>`).join('')}</div></div>
  ${voiceSettings()}
  <div class="panel"><h2>学习记录保存</h2>
    <p style="margin:0 0 10px">${cloudOn?'☁️ 学习记录会自动保存在你的 Claude 帐号里，换设备打开同一个链接也能继续。':'💾 学习记录保存在这台设备的浏览器里（换设备不会同步）。'}</p>
    <div class="row"><button class="btn pink" data-act="reset">清除 ${esc(S.name)} 的学习记录</button>${Object.keys(ALL.kids).length>1?`<button class="btn" data-act="delkid">删除 ${esc(S.name)}</button>`:''}</div></div>`}

function voiceSettings(){
  const row=(l,flag,name,sample)=>{const vs=voicesFor(l);const cur=pickVoice(l);
    return `<div class="row" style="margin-bottom:10px"><b style="min-width:72px">${flag} ${name}</b>
    ${vs.length?`<select class="vsel" data-l="${l}" aria-label="${name}声音">${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&cur.voiceURI===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>`:'<span class="zh" style="flex:1">没有找到这个语言的声音</span>'}
    <button class="btn" data-act="sayL" data-l="${l}" data-v="${esc(sample)}">🔊 试听</button></div>`};
  const ms=hasMalay();
  return `<div class="panel"><h2>朗读声音 🔊</h2>
    <p class="zh" style="margin:-6px 0 12px;font-size:15px">每台设备的声音不一样，挑一个孩子听得最清楚的。设定只保存在这台设备上。</p>
    ${row('en','🇬🇧','英文','Hello! This is a cat. I have a kite.')}
    ${row('ms','🇲🇾','国文','Selamat pagi! Ini kucing. Saya ada layang-layang.')}
    ${row('zh','🇨🇳','华文','你好！这是猫。我有一个风筝。')}
    <div class="row" style="margin:6px 0 12px"><b>说话速度</b>${[[0.8,'🐢 慢'],[1,'🙂 正常'],[1.2,'🐇 快']].map(([r,t])=>`<button class="btn ${VP.rate===r?'sky':''}" data-act="rate" data-v="${r}">${t}</button>`).join('')}</div>
    ${ms?'':`<p style="margin:0 0 6px;font-weight:700">⚠️ 这台设备没有马来语声音，国文会用${voicesFor('ms').length?'印尼语':'其他语言的'}声音代替，口音会有点不同。</p>`}
    <p class="zh" style="font-size:15px;margin:0">加装马来语声音：<br>• iPad：设置 › 辅助功能 › 朗读内容 › 声音 › 马来语<br>• Android：设置 › 系统 › 语言 › 文字转语音输出，在语音引擎里安装马来语（如果有）<br>• Windows：用 Edge 打开通常已有 Microsoft 马来语声音；或 设置 › 时间和语言 › 语音 › 添加语音</p></div>`}

function render(){
  const v=view.name;
  document.documentElement.dataset.skin=SKINS.some(s=>s[0]===S.skin)?S.skin:'toy';
  app.innerHTML=v==='setup'?vSetup():v==='home'?vHome():v==='topic'?vTopic():v==='game'?vGame():v==='end'?vEnd():v==='growth'?vGrowth():v==='map'?vMap():v==='album'?vAlbum():v==='missions'?vMissions():v==='duel'?vDuelSetup():v==='duelplay'?vDuel():v==='pet'?vPet():v==='mtopic'?vMTopic():v==='kids'?vKids():vSettings();
}

/* ---------------- actions ---------------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'ava':view.ava=v;view.nm=(document.getElementById('nm')||{}).value;sTap();render();break;
    case 'start':{const n=(document.getElementById('nm').value||'').trim();if(!n){toast('先写下你的名字哦 ✏️');return}
      if(view.newKid){const id='k'+Date.now();ALL.kids[id]=blank();ALL.cur=id;S=ALL.kids[id];S.avatar='🐰'}
      S.name=n;S.avatar=view.ava||S.avatar;touch();sGood();go({name:'home'});speak('Hello '+n,'en');break}
    case 'home':go({name:'home'});break;
    case 'growth':go({name:'growth'});break;
    case 'settings':go({name:'settings'});break;
    case 'lang':S.subj='lang';S.lang=v;touch();sTap();render();speak(v==='en'?'English':'Bahasa Melayu',v);break;
    case 'topic':sTap();go({name:'topic',topic:v});break;
    case 'play':startGame(v);break;
    case 'say':speak(v,S.lang);break;
    case 'sayL':speak(v,b.dataset.l);break;
    case 'sayCur':speakCur();break;
    case 'sayZh':speak(cur().w.zh,'zh');break;
    case 'prev':if(G.i>0){G.i--;resetRec();render();speakCur()}break;
    case 'lnext':cur().done=true;resetRec();if(G.i<G.qs.length-1){G.i++;render();speakCur()}else endGame();break;
    case 'rec':toggleRec();break;
    case 'card':{if(G.lock)return;const c=G.cards[+v];if(!c||c.up||c.done)return;c.up=true;sTap();if(c.k==='t')speak(c.w[G.lang],G.lang);G.open.push(c);
      if(G.open.length===2){G.moves++;const [a1,a2]=G.open;G.open=[];
        if(a1.w===a2.w){a1.done=a2.done=true;G.score++;G.combo++;G.best=Math.max(G.best,G.combo);render();sGood();speak(a1.w[G.lang],G.lang);burst(document.querySelector('.mcard[data-v="'+a1.i+'"]'),G.combo>=3?'🔥':null);
          if(G.cards.every(x=>x.done))setTimeout(endGame,1300);return}
        G.combo=0;G.lock=true;render();sBad();setTimeout(()=>{a1.up=false;a2.up=false;G.lock=false;render()},1000);return}
      render();break}
    case 'pet':sTap();go({name:'pet'});break;
    case 'map':sTap();go({name:'map'});break;
    case 'album':sTap();go({name:'album'});break;
    case 'missions':sTap();go({name:'missions'});break;
    case 'duel':sTap();go({name:'duel',opp:D?D.opp:0,sub:D?D.sub:'en'});break;
    case 'station':startStation(+v);break;
    case 'locked':sBad();toast('先完成前面的关卡哦 🔒');break;
    case 'cardsay':{const w=WMAP[b.dataset.t+':'+v];if(!w)return;speak(w.en,'en');speak(w.ms,'ms',true);speak(w.zh,'zh',true);burst(b,'✨');break}
    case 'mdone':{const m=missionState();if(m.done.includes(+v))return;m.done.push(+v);addStars(2);touch();render();sGood();speak('太棒了！','zh');burst(document.querySelector('.mission.ok:last-of-type')||document.querySelector('.mission'),'🌟');break}
    case 'dopp':view.opp=+v;sTap();render();break;
    case 'dsub':view.sub=v;sTap();render();break;
    case 'dstart':if(view.name==='duelplay'){view.opp=D.opp;view.sub=D.sub}startDuel();break;
    case 'dsay':duelSay();break;
    case 'dquit':if(D&&!D.over&&!confirm('要结束对战吗？'))return;go({name:'duel',opp:D?D.opp:0,sub:D?D.sub:'en'});break;
    case 'dans':{const p=+b.dataset.p,i=+v,q=D.qs[D.i];if(D.done||D.lock[p])return;
      if(q.opts[i].v===q.ans){D.done=true;D.winner=p;D.sc[p]++;render();sGood();burst(document.querySelector('.dside.p'+p),'⚡');speak(q.ansText,q.ansLang);setTimeout(duelNext,1900)}
      else{D.lock[p]=true;sBad();if(D.lock[0]&&D.lock[1]){D.done=true;D.winner=null;render();speak(q.ansText,q.ansLang);setTimeout(duelNext,1900)}else render()}break}
    case 'limit':S.limit=+v;touch();render();break;
    case 'pat':{const t=pick(MOMO_TALK),li=rnd(0,2);const el=document.getElementById('petsay');if(el)el.innerHTML=esc(t[2])+'<small>'+esc(li===2?t[0]:t[li])+'</small>';speak(t[li],['en','ms','zh'][li]);
      const m=document.querySelector('.room .momo');if(m){m.classList.remove('dance');void m.offsetWidth;m.classList.add('dance');setTimeout(()=>m.classList.remove('dance'),1500);burst(m,'💖')}break}
    case 'feed':{if((S.bamboo||0)<3)return;const p=pet();S.bamboo-=3;p.happy=Math.min(100,happyNow()+25);p.fed=Date.now();touch();render();sGood();speak('好吃！谢谢你！','zh');burst(document.querySelector('.room .momo'),'🎋');break}
    case 'buy':{const x=SHOP.find(i=>i.id===v),p=pet();if(!x||p.owned.includes(x.id))return;if((S.bamboo||0)<x.p){sBad();toast('竹子还不够哦，再去学习赚 '+(x.p-(S.bamboo||0))+' 根竹子吧 🎋');return}
      S.bamboo-=x.p;p.owned.push(x.id);if(x.slot==='bg')p.bg=x.id;else{p.wear=p.wear||{};p.wear[x.slot]=x.id}touch();render();sGood();toast('买到了 '+x.e+' '+x.zh+'！');burst(document.querySelector('.room .momo'),x.e);break}
    case 'wear':{const p=pet();if(v==='sky'||v.startsWith('bg-'))p.bg=v;else{const x=SHOP.find(i=>i.id===v);if(!x)return;p.wear=p.wear||{};p.wear[x.slot]=p.wear[x.slot]===x.id?null:x.id}touch();sTap();render();break}
    case 'mine':playMine();break;
    case 'compare':speakCur();setTimeout(playMine,1700);break;
    case 'kids':go({name:'kids'});break;
    case 'rate':VP.rate=+v;saveVP();render();speak('This is a cat.','en');break;
    case 'pickkid':ALL.cur=v;S=ALL.kids[v];touch();sGood();go({name:S.name?'home':'setup'});break;
    case 'addkid':go({name:'setup',newKid:true});break;
    case 'delkid':{if(Object.keys(ALL.kids).length<2)return;if(confirm('确定要删除 '+S.name+' 的全部资料吗？')&&confirm('真的确定吗？这个动作不能复原。')){delete ALL.kids[ALL.cur];ALL.cur=Object.keys(ALL.kids)[0];S=ALL.kids[ALL.cur];touch();toast('已删除');go({name:'home'})}break}
    case 'copyrep':{const t=reportText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('报告已复制，可以贴到 WhatsApp 📋'),()=>toast('复制不了，请手动截图保存'));break}
    case 'ans':{const q=cur(),i=+v;const ok=q.m==='math'?q.opts[i].v===q.ans:q.opts[i]===q.w;if(ok)answer(true,b);else{q.wrongIdx.push(i);answer(false);if(q.m==='bubble'){b.classList.add('popx')}else{b.classList.add('shake');setTimeout(render,400)}}break}
    case 'tile':{const q=cur(),t=q.tiles.find(x=>x.id===+v);const s=q.slots.find(x=>!x.fixed&&!x.val);if(!t||t.used||!s)return;
      t.used=true;s.val=t.ch;s.tile=t.id;sTap();render();spellCheck();break}
    case 'unslot':{const q=cur();if(q.done)return;const s=q.slots[+v];if(!s||!s.val)return;q.tiles.find(t=>t.id===s.tile).used=false;s.val=null;s.tile=null;render();break}
    case 'clear':{const q=cur();q.slots.forEach(s=>{if(!s.fixed){s.val=null;s.tile=null}});q.tiles.forEach(t=>t.used=false);render();break}
    case 'hint':{const q=cur();const i=q.slots.findIndex(s=>!s.fixed&&s.val!==s.ch);if(i<0)return;q.hinted=true;
      const s=q.slots[i];if(s.val){q.tiles.find(t=>t.id===s.tile).used=false;s.val=null;s.tile=null}
      const blk=q.slots.find((x,j)=>j!==i&&!x.fixed&&x.val===s.ch&&x.ch!==s.ch);if(blk){q.tiles.find(t=>t.id===blk.tile).used=false;blk.val=null;blk.tile=null}
      const t=q.tiles.find(t=>!t.used&&t.ch===s.ch);if(t){t.used=true;s.val=t.ch;s.tile=t.id}render();spellCheck();break}
    case 'next':if(G.i<G.qs.length-1){G.i++;setupTiles();render();const m=cur().m;if(m==='listen'||m==='sent'||m==='math')setTimeout(speakCur,250)}else endGame();break;
    case 'quit':if(G&&G.qs.some(q=>q.done)&&!confirm('要离开吗？这一轮的进度不会保存成绩（已得的星星会保留）。'))return;G.station!=null?go({name:'map'}):(G.mode==='math'||G.mode==='sci')?go({name:'mtopic',game:G.game}):G.topic==='review'?go({name:'home'}):go({name:'topic',topic:G.topic});break;
    case 'again':G&&G.station!=null?startStation(G.station):(view.mode==='math'||view.mode==='sci')?startMath(G.game,G.level):startGame(view.mode);break;
    case 'subj':S.subj=v||'math';touch();sTap();render();speak(S.subj==='sci'?'我们来学科学！':'我们来学数学！','zh');break;
    case 'mtopic':sTap();go({name:'mtopic',game:v});break;
    case 'mplay':startMath(view.game,+v);break;
    case 'mhint':cur().hint=true;render();break;
    case 'back':G.station!=null?go({name:'map'}):(G.mode==='math'||G.mode==='sci')?go({name:'mtopic',game:G.game}):G.topic==='review'?go({name:'home'}):go({name:'topic',topic:G.topic});break;
    case 'rename':{const n=(document.getElementById('nm2').value||'').trim();if(n){S.name=n;touch();toast('已保存 ✓');render()}break}
    case 'setava':S.avatar=v;touch();render();break;
    case 'goal':S.goal=+v;touch();render();break;
    case 'zh':S.showZh=!S.showZh;touch();render();break;
    case 'snd':S.sound=!S.sound;touch();render();break;
    case 'skin':S.skin=v;touch();render();sGood();break;
    case 'reset':if(confirm('确定要清除全部学习记录吗？星星、贴纸和成长记录都会归零。')&&confirm('真的确定吗？这个动作不能复原。')){const keep={name:S.name,avatar:S.avatar};S=ALL.kids[ALL.cur]=Object.assign(blank(),keep);touch();toast('已清除');go({name:'home'})}break;
  }
});
app.addEventListener('change',e=>{const t=e.target;if(t.classList&&t.classList.contains('vsel')){VP[t.dataset.l]=t.value;saveVP();speak({en:'Hello!',ms:'Selamat pagi!',zh:'你好！'}[t.dataset.l],t.dataset.l)}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){app.querySelector('[data-act="start"]').click()}});

render();
setTimeout(initCloud,0);
</script>
</body>
</html>
