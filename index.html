<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#5AB8FF">
<title>Momo 学英文·国文</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDF0FF; --dot:#C3E2FB; --surface:#FFFFFF; --ink:#2A2F6B; --muted:#6B70A8; --edge:#2A2F6B;
  --sun:#FFD23F; --pink:#FF8FB1; --mint:#6FD6A8; --sky:#5AB8FF; --line:#C9E2F7;
  --good:#2FB36E; --bad:#FF6B6B; --soft:#F2F8FF; --custom:#FFE9A8; --s-en:#9FD3FF; --s-ms:#FFB3C7; --s-math:#FFE07A; --s-sci:#9BE3C0; --s-cn:#FFC29B; --s-world:#A8E6CF; --st-grey:#D9DCE6; --hib:#E3263B; --hib-deep:#9E1028; --hib-vein:#B5122E; --stamen:#FFD23F;
  /* skin shape tokens: border width, button/panel radius, shadows, press motion, page paper, font */
  --bw:3px; --rb:18px; --rp:28px; --shb:0 5px 0 var(--edge); --shpress:0 1px 0 var(--edge); --press:translateY(4px); --shp:none;
  --paper:radial-gradient(var(--dot) 2px, transparent 2.5px) 0 0/28px 28px, var(--bg);
  --font:"Baloo 2","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B1F45; --dot:#252A5A; --surface:#272C5E; --ink:#F3F4FF; --muted:#AEB3E8; --edge:#8C92E8;
    --line:#3A407A; --soft:#22275A; --st-grey:#3A3F6A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B1F45; --dot:#252A5A; --surface:#272C5E; --ink:#F3F4FF; --muted:#AEB3E8; --edge:#8C92E8;
  --line:#3A407A; --soft:#22275A; --st-grey:#3A3F6A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background:var(--paper);background-attachment:fixed;
  color:var(--ink);
  font-family:var(--font);
  font-size:18px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;
}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
#app{max-width:980px;margin:0 auto;padding:16px 18px 40px}
h1,h2,h3{margin:0;line-height:1.15}
.zh{color:var(--muted)}
.hide{display:none!important}

/* toy-block buttons: the signature element */
.btn{
  font-weight:700;border:var(--bw) solid var(--edge);border-radius:var(--rb);background:var(--surface);color:var(--ink);
  padding:10px 18px;box-shadow:var(--shb);cursor:pointer;
  transition:transform .08s ease, box-shadow .08s ease;display:inline-flex;align-items:center;gap:8px;justify-content:center;
  min-height:52px;
}
.btn:active{transform:var(--press);box-shadow:var(--shpress)}
.btn:focus-visible,.opt:focus-visible,.topic:focus-visible{outline:4px solid var(--sky);outline-offset:3px}
.btn.sun{background:var(--sun);color:#2A2F6B}
.btn.pink{background:var(--pink);color:#2A2F6B}
.btn.mint{background:var(--mint);color:#2A2F6B}
.btn.sky{background:var(--sky);color:#fff}
.btn.big{font-size:24px;padding:14px 28px;min-height:66px}
.btn.round{border-radius:50%;width:58px;height:58px;padding:0;font-size:26px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* top bar */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.who{background:none;border:0;cursor:pointer;padding:0;text-align:left;display:flex;align-items:center;gap:10px;margin-right:auto;font-weight:800;font-size:22px}
.ava{width:52px;height:52px;border-radius:50%;background:var(--surface);border:3px solid var(--edge);display:grid;place-items:center;font-size:30px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--sun);color:#2A2F6B;border:3px solid var(--edge);border-radius:999px;padding:4px 14px;font-weight:800}
.tabs{display:flex;gap:8px}
.tabs .btn{min-height:48px;padding:6px 14px;white-space:nowrap}
@media (max-width:560px){.tabs{gap:6px;flex-wrap:wrap}.tabs .btn{padding:6px 9px;font-size:15px}.subhead h1{font-size:28px!important}}
.tabs .btn.on{background:var(--sky);color:#fff}

/* panels */
.panel{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--rp);box-shadow:var(--shp);padding:18px 20px;margin-bottom:18px}
.hello{display:flex;align-items:center;gap:16px}
.bubble{position:relative;background:var(--soft);border-radius:22px;padding:12px 18px;font-size:20px;font-weight:700;flex:1}
.bubble small{display:block;font-weight:500;font-size:16px;color:var(--muted)}
.today{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ring{position:relative;width:96px;height:96px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
.seg{display:inline-flex;border:3px solid var(--edge);border-radius:20px;overflow:hidden;background:var(--surface)}
.seg{flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:10px 14px;font-weight:700;cursor:pointer;min-height:52px}
.seg button.on{background:var(--mint);color:#2A2F6B}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

.flower{display:block;width:min(100%,540px);margin:0 auto 14px;overflow:visible}
.petal{cursor:pointer;outline:none}
.petal .pb{transition:transform .15s ease,filter .15s;transform-origin:200px 200px}
.petal:hover .pb,.petal:focus-visible .pb{transform:scale(1.05);filter:brightness(1.08)}
.petal:active .pb{transform:scale(.97)}
.petal:focus-visible .pb path:first-child{stroke:var(--sun);stroke-width:7}
.petal text{pointer-events:none}
@media (prefers-reduced-motion: reduce){.petal .pb{transition:none}.petal:hover .pb,.petal:active .pb{transform:none}}
.subjs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:18px}
.subj{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:190px;padding:16px 10px;border:var(--bw) solid var(--edge);border-radius:var(--rp);box-shadow:var(--shb);color:#2A2F6B;cursor:pointer;font-family:inherit;transition:transform .08s,box-shadow .08s}
.subj:active{transform:var(--press);box-shadow:var(--shpress)}
.subj .se2{font-size:64px;line-height:1.1}.subj b{font-size:32px;line-height:1.2}.subj .sd{font-size:15px;font-weight:600;opacity:.8}.subj .sp{margin-top:6px;font-size:14px;font-weight:700;background:rgba(255,255,255,.65);border-radius:999px;padding:2px 10px}
.subj .last{position:absolute;top:-12px;right:10px;background:var(--surface);color:var(--ink);border:3px solid var(--edge);border-radius:999px;padding:0 10px;font-size:14px;font-weight:800}
.mstar{display:none}@media (max-width:560px){.mstar{display:inline}}
.abar{display:grid;grid-template-columns:minmax(86px,auto) 1fr auto;align-items:center;gap:10px;margin:6px 0;font-weight:700}
.abar .tr{height:16px;background:var(--soft);border-radius:4px;overflow:hidden}.abar .tr i{display:block;height:100%;border-radius:0 4px 4px 0;min-width:2px}
.abar .v{white-space:nowrap;min-width:64px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}.abar small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.vbars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:22px;border-bottom:2px solid var(--line)}
.vbars .vb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative}
.vbars .vb i{display:block;width:70%;max-width:46px;background:var(--sky);border-radius:4px 4px 0 0;min-height:2px}
.vbars .vb b{font-size:13px;color:var(--ink);margin-bottom:2px}.vlabels{display:flex;gap:10px}.vlabels span{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.ins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.ins>div{border:3px solid var(--edge);border-radius:18px;padding:12px 14px;background:var(--surface)}.ins h3{margin:0 0 6px;font-size:18px}.ins ul{margin:0;padding-left:18px}.ins li{margin:3px 0}
.kidtabs{display:flex;gap:8px;flex-wrap:wrap}
.admhead{flex-wrap:wrap}.admhead .t{flex:1 1 220px}
@media (max-width:560px){.adm .stats{grid-template-columns:repeat(2,1fr);gap:10px}.adm .stat .n{font-size:26px}.admhead>span{display:none}}
.more h2{font-size:20px}.more .feat{min-height:96px}.more .feat .fe{font-size:32px}
.subhead{color:#2A2F6B}.subhead .se2{font-size:72px;line-height:1}
@media (max-width:560px){.hello .ring{display:none}.subjs{grid-template-columns:repeat(2,1fr)}.subj:last-child:nth-child(odd){grid-column:1/-1}.subj{min-height:150px}.subj .se2{font-size:50px}.subj b{font-size:26px}}
.blks{display:flex;gap:18px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin:6px 0}.blks span{display:flex;flex-wrap:wrap;gap:4px;max-width:220px;align-items:flex-end}
.blk{display:inline-block;border:2px solid #2A2F6B;border-radius:3px}
.col{margin:6px auto;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;border-collapse:collapse}.col td{width:34px;text-align:center;padding:0 2px}.col tr.ln td{border-top:4px solid var(--edge)}
.grp{display:inline-block;border:3px dashed var(--line);border-radius:16px;padding:4px 6px;margin:3px}
.wemoji{font-size:120px;line-height:1.1;margin:4px 0}
.wbig{display:flex;justify-content:center;margin:4px 0}
.wbig svg{width:min(260px,70vw);height:auto;border-radius:10px;box-shadow:0 4px 0 var(--edge);border:3px solid var(--edge)}
.wflag{display:block;width:100%;height:auto}.wfo{display:block;width:84px;margin:0 auto 4px}.wfo svg{border-radius:6px;border:2px solid var(--edge)}
#scenedeco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#scenedeco span{position:absolute;font-size:64px;opacity:.22;animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
@media (prefers-reduced-motion: reduce){#scenedeco span{animation:none}}
@media (max-width:560px){#scenedeco span{font-size:42px;opacity:.16}.scenepill{display:none}}
#app{position:relative;z-index:1}
html[data-scene] body{background:linear-gradient(var(--scene-tint),var(--scene-tint)),var(--paper);background-attachment:fixed}
html[data-scene="ocean"]{--scene-tint:rgba(40,150,255,.22)}html[data-scene="space"]{--scene-tint:rgba(70,50,170,.26)}html[data-scene="forest"]{--scene-tint:rgba(46,160,80,.2)}
html[data-scene="candy"]{--scene-tint:rgba(255,120,190,.2)}html[data-scene="farm"]{--scene-tint:rgba(230,180,60,.22)}html[data-scene="garden"]{--scene-tint:rgba(255,150,200,.16)}
html[data-scene="city"]{--scene-tint:rgba(120,140,170,.2)}html[data-scene="toys"]{--scene-tint:rgba(255,200,60,.2)}html[data-scene="fruit"]{--scene-tint:rgba(255,110,90,.18)}
.ghead{grid-column:1/-1;margin:6px 0 -4px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.topic{
  border:var(--bw) solid var(--edge);border-radius:var(--rp);padding:16px 14px 14px;text-align:left;cursor:pointer;
  box-shadow:var(--shb);color:#2A2F6B;transition:transform .08s, box-shadow .08s;position:relative;
  display:flex;flex-direction:column;align-items:flex-start;
}
.topic>*{max-width:100%}
.topic .foot{margin-top:auto;padding-top:8px;align-self:stretch}
@media (max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.topic{padding:12px 10px 10px}.topic .ic{font-size:40px}.topic h3{font-size:19px}.topic .t2{font-size:14px}}
.topic:active{transform:var(--press);box-shadow:var(--shpress)}
.topic .ic{font-size:52px;line-height:1}
.topic h3{font-size:24px;margin-top:6px}
.topic .t2{font-size:16px;opacity:.8}
.meter{height:12px;border-radius:99px;background:rgba(42,47,107,.15);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:#2A2F6B;border-radius:99px}
.topic .cnt{font-size:14px;font-weight:700;margin-top:4px}
/* 📖 story painting adventure */
.stmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px}
.stisle.grey{filter:saturate(.35)}.stisle[disabled]{opacity:.55;cursor:not-allowed}
.stcanvas{display:flex;justify-content:space-around;align-items:flex-end;gap:6px;border:var(--bw) solid var(--edge);border-radius:var(--rp);padding:18px 10px 14px;margin-bottom:12px;min-height:150px;
  background:linear-gradient(var(--st-grey),var(--surface));transition:background .8s}
.stcanvas.lit{background:linear-gradient(var(--sthue),var(--surface))}
.stitem{font-size:clamp(46px,12vw,84px);line-height:1;background:none;border:0;padding:0;filter:grayscale(1) opacity(.5);transition:filter .6s,transform .3s;color:inherit;font-family:inherit}
.stitem.on{filter:none;transform:scale(1.08)}
.stitem.can{cursor:pointer;animation:stwig 1.2s ease-in-out infinite;filter:grayscale(1) opacity(.8)}
@keyframes stwig{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg) translateY(-6px)}}
@media (prefers-reduced-motion: reduce){.stitem.can{animation:none;outline:3px dashed var(--sun);outline-offset:4px;border-radius:12px}}
.sttext{font-size:21px;line-height:1.65}
.bag{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stgallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stmini{border:var(--bw) solid var(--edge);border-radius:18px;font-size:clamp(20px,5vw,30px);text-align:center;padding:10px 4px;white-space:nowrap;overflow:hidden}
.tellpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.tellobj{flex-direction:column;position:relative;padding:10px 6px}
.tellobj .tnum{position:absolute;top:4px;right:8px;font-weight:800;font-size:20px}
/* tidy word-topic page: one group at a time, compact cards */
.ltabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 14px}
.ltabs .btn{font-size:17px;padding:8px 14px;min-height:44px}
.ltabs .btn small{font-size:13px;opacity:.75;margin-left:4px}
.grid.tidy{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid.tidy .ghead{font-size:18px;margin:8px 0 -2px;opacity:.85}
.grid.tidy .topic{padding:12px 12px 10px}
.grid.tidy .topic .ic{font-size:40px}
.grid.tidy .topic h3{font-size:19px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid.tidy .topic .t2{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:100%}
.grid.tidy .topic .tag{font-size:11px;margin-top:4px}
.grid.tidy .topic .meter{height:9px;margin-top:4px}
.grid.tidy .topic .cnt{font-size:12px}
@media (max-width:560px){.grid.tidy{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.grid.tidy .topic{padding:9px 8px 8px}.grid.tidy .topic .ic{font-size:30px}.grid.tidy .topic h3{font-size:15px;margin-top:4px}.grid.tidy .topic .t2{font-size:11px}.grid.tidy .topic .tag{display:none}.grid.tidy .topic .cnt{font-size:11px}.grid.tidy .ghead{font-size:16px}.ltabs{gap:6px}.ltabs .btn{font-size:15px;padding:6px 10px}}

.figframe{display:block;width:100%;height:520px;border:0;background:transparent}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px 18px;border-radius:24px}
.mode .e{font-size:40px}
.mode b{font-size:22px}
.mode span{font-size:15px;font-weight:500;color:var(--muted)}

/* game */
.gbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.gbar .pill{white-space:nowrap;flex:none}
.gbar .btn.round{flex:none}
.gbar .fsico{width:22px;height:22px;display:block}
@media (max-width:700px){.gbar{flex-wrap:wrap;gap:8px;justify-content:flex-end}.gbar>.btn.round:first-child{margin-right:auto}.gbar .dots{order:9;flex:1 1 100%;justify-content:center;gap:5px}.gbar .dots i{width:14px;height:14px;border-width:2.5px}}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--edge);background:var(--surface)}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--sun)} .dots i.now{background:var(--sky)}
.stage{text-align:center}
.prompt{font-size:120px;line-height:1.1;margin:6px 0}
.word{font-size:46px;font-weight:800;letter-spacing:.5px}
.helpzh{font-size:26px;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:640px;margin:18px auto 0}
.opt{
  background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--rp);box-shadow:var(--shb);
  padding:14px;cursor:pointer;min-height:110px;display:grid;place-items:center;font-weight:800;font-size:30px;
  transition:transform .08s, box-shadow .08s;
}
.opt.emo{font-size:72px}
.hz{font-family:"Kaiti SC","STKaiti","KaiTi","PingFang SC","Noto Sans SC",serif;font-weight:700}
.letter{max-width:560px;text-align:left;white-space:pre-line;font-size:20px;line-height:1.6}
.letter h1{text-align:center}
.saybox{margin:10px auto 0;max-width:520px;font-weight:700}
.ptable{width:100%;border-collapse:collapse;font-size:18px}
.ptable th,.ptable td{border:3px solid var(--edge);padding:10px 8px;text-align:center}
.ptable td.stk{height:64px;width:22%}
.mlist{display:flex;flex-wrap:wrap;gap:10px}
@media print{body{background:#fff!important;color:#000}.bar,.noprint,.toast,.rest{display:none!important}.panel{box-shadow:none!important;break-inside:avoid}#app{padding:0}}
.ico{width:1em;height:1em;vertical-align:-0.12em;display:inline-block}
.zpic{display:inline-block;font-size:.4em;font-weight:800;line-height:1.2;max-width:6em;word-break:break-word}
.topic.add{background:var(--surface);border-style:dashed;color:var(--ink)}
.cl-in{width:100%;font-size:20px;border:3px solid var(--edge);border-radius:14px;padding:8px 12px;background:var(--surface);color:var(--ink);font-family:inherit;user-select:text;-webkit-user-select:text}
textarea.cl-in{min-height:220px;line-height:1.5;resize:vertical}
.cl-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:2px dashed var(--line)}
.cl-row:last-child{border-bottom:0}
.cl-bad{background:var(--soft);border:3px dashed var(--bad);border-radius:18px;padding:10px 14px;margin:10px 0}
.opt:active{transform:var(--press);box-shadow:var(--shpress)}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{background:var(--bad);color:#fff;opacity:.6;pointer-events:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.feedback{margin:18px auto 0;max-width:640px;background:var(--soft);border:3px dashed var(--line);border-radius:24px;padding:12px 16px;display:flex;align-items:center;gap:14px;text-align:left}
.feedback .ft{flex:1;font-size:20px;font-weight:700}
.feedback .ft small{display:block;font-weight:500;color:var(--muted);font-size:17px}

.card{max-width:520px;margin:0 auto;background:var(--surface);border:3px solid var(--edge);border-radius:34px;box-shadow:0 8px 0 var(--edge);padding:24px;cursor:pointer}
.card .other{font-size:20px;color:var(--muted);margin-top:4px}

.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{width:54px;height:62px;border-radius:14px;border:3px dashed var(--edge);display:grid;place-items:center;font-size:32px;font-weight:800;background:var(--soft);cursor:pointer}
.slot.f{background:var(--sun);border-style:solid;color:#2A2F6B}

/* ---------- 画风皮肤 skins: set on <html data-skin> (whole app) or on a .skin preview card ---------- */
.skin[data-skin="toy"]{
  --bg:#DDF0FF; --dot:#C3E2FB; --surface:#FFFFFF; --ink:#2A2F6B; --muted:#6B70A8; --edge:#2A2F6B;
  --sun:#FFD23F; --pink:#FF8FB1; --mint:#6FD6A8; --sky:#5AB8FF; --line:#C9E2F7; --good:#2FB36E; --bad:#FF6B6B; --soft:#F2F8FF;
  --bw:3px; --rb:18px; --rp:28px; --shb:0 5px 0 var(--edge); --shpress:0 1px 0 var(--edge); --press:translateY(4px); --shp:none;
  --paper:radial-gradient(var(--dot) 2px, transparent 2.5px) 0 0/28px 28px, var(--bg);
}
/* 蜡笔手绘: cream lined paper, wobbly hand-drawn outlines */
:is(:root,.skin)[data-skin="crayon"]{
  --bg:#FFF8E7; --dot:#EFDDB4; --surface:#FFFDF6; --ink:#3B3024; --muted:#8A7A62; --edge:#3B3024;
  --sun:#FFC94D; --pink:#FF9EAA; --mint:#9BDB8F; --sky:#5FA8DC; --line:#EADBB8; --good:#3E9E48; --bad:#E85D4A; --soft:#FFF1D0;
  --bw:2.5px; --rb:24px 8px 22px 10px/10px 22px 8px 24px; --rp:40px 14px 36px 12px/12px 30px 14px 40px;
  --shb:3px 4px 0 var(--edge); --shpress:1px 1px 0 var(--edge); --press:translate(2px,3px); --shp:4px 5px 0 rgba(59,48,36,.16);
  --paper:repeating-linear-gradient(0deg,transparent 0 30px,var(--dot) 30px 32px), linear-gradient(90deg,transparent 46px,#F7B7B7 46px 48px,transparent 48px), var(--bg);
  color-scheme:light;

  --bw:2px; --rb:14px 26px 12px 24px; --rp:10px; --shb:0 3px 0 var(--edge); --shpress:0 1px 0 var(--edge); --press:translateY(2px); --shp:inset 0 0 28px rgba(80,60,20,.09);

function parseWords(txt){const out=[],bad=[];
  String(txt||'').split(/\n/).forEach(line=>{line=line.trim();if(!line)return;
    const parts=line.split(/[,，|\t=、;；]+/).map(x=>x.trim()).filter(Boolean);let w='',zh='',e='';

    if(!e&&!zh){bad.push(line+'  ← 请加上中文意思或一个表情图');return}

    if(out.length>=CL_MAX_WORDS){bad.push(line+'  ← 一个词表最多 '+CL_MAX_WORDS+' 个词');return}

let cloudRef=null,cloudTimer=null,cloudBusy=false,cloudAgain=false,cloudOn=false;
async function initCloud(){
  if(!window.claude||!window.claude.use)return;
  try{
    const db=await window.claude.use('db');const user=await window.claude.use('user');
    if(!db||!user)return;const id=await user.id();if(!id)return;
    cloudRef=db.collection('data/users/'+id).doc('progress');
    const snap=await cloudRef.get();cloudOn=true;
    if(snap.exists){const d=snap.data();if(d&&typeof d.state==='string'){const remote=normalize(JSON.parse(d.state));
      if((remote.updatedAt||0)>(ALL.updatedAt||0)){ALL=remote;S=ALL.kids[ALL.cur];saveLocal();if(view.name!=='game')render()}
      else if((ALL.updatedAt||0)>(remote.updatedAt||0))queueCloud()}}
    else if(S.name)queueCloud();
    if(view.name==='settings')render();
  }catch(e){}
}
function queueCloud(){if(!cloudRef)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(pushCloud,1500)}

  try{await cloudRef.set({state:JSON.stringify(ALL),updatedAt:ALL.updatedAt})}catch(e){}
  cloudBusy=false;if(cloudAgain){cloudAgain=false;pushCloud()}}

      if(recUrl)URL.revokeObjectURL(recUrl);recUrl=URL.createObjectURL(blob);recState='done';const d=dayRec();d.rec=(d.rec||0)+1;touch();

/* no repeated questions: each slot takes the least-recently-seen of up to 60 candidates
   (this round's picks count as most recent), so a round has no repeats when the bank is big enough,
   repeats in small banks are spread out, and the next round avoids what was just asked. History kept in memory. */
const sigTxt=h=>String(h||'').replace(/\p{Extended_Pictographic}|\uFE0F|\u200D/gu,'');
const qSig=q=>{if(q._sig)return q._sig;let v='';try{v=sigTxt(q.html(false))+'|'+(q.optsFn?q.optsFn(false):q.opts.map(o=>o.l==null?o.v:o.l)).map(sigTxt).sort().join('~')}catch(e){}
  return q._sig=String(q.say||q.title||'')+'|'+String(q.ans)+'|'+v};
const RECENT={};
function genSet(gm,level,n,key){const out=[],hist=(RECENT[key]||[]).slice();
  for(let i=0;i<n;i++){let best=null,bs=-2;

function startStation(idx){if(overLimit()){showRest();return}const st=STATIONS[idx];
  if(st.k==='word'){view.topic=st.topic;startGame(st.mode,st.topic,st.lang)}else if(st.k==='math')startMath(st.game,st.level);else startBoss(idx);
  if(G)G.station=idx}
function startBoss(idx){newLook();const st=STATIONS[idx];const qs=[];
  st.words.forEach(tid=>{const pool=T(tid).words;shuffle(pool).slice(0,2).forEach(w=>qs.push({w,m:pick(['read','listen']),opts:shuffle([w,...shuffle(pool.filter(x=>x!==w)).slice(0,3)]),missed:false,hinted:false,done:false,wrongIdx:[]}))});
  st.games.forEach(g=>{const gm=MG[g]||SG[g];genSet(gm,1,2,g+':1').forEach(q0=>qs.push(Object.assign(q0,{m:'math',g,lvl:1,missed:false,hinted:false,done:false,hint:false,wrongIdx:[]})))});
  resetRec();G={topic:'boss:'+idx,mode:'boss',lang:st.lang,i:0,score:0,combo:0,best:0,start:Date.now(),starsBefore:S.stars,cardsBefore:cardCount(),qs:shuffle(qs),station:idx};
  go({name:'game'});setTimeout(()=>{if(!G||!G.qs[G.i])return;const m=cur().m;if(m==='listen'||m==='math')speakCur()},350)}

  let words,topicId;

     qs:words.map(w=>{const pool=T(w.t).words;return {w,m:mode==='review'?pick(['listen','read']):mode,opts:shuffle([w,...shuffle(pool.filter(x=>x!==w)).slice(0,mode==='bubble'?4:3)]),missed:false,hinted:false,done:false,wrongIdx:[]}})};

function mistClear(q){const M=S.mist;if(q.m==='math'){const k=q.g+':'+(q.lvl||1);if(M.m[k]>1)M.m[k]--;else delete M.m[k]}else delete M.w[wkey(q.lang||G.lang,q.w)]}

function mistGames(){return Object.entries(S.mist.m).map(([k,n])=>{const [g,l]=k.split(':');return GAME(g)?{k,g,l:+l,n,gm:GAME(g)}:null}).filter(Boolean).sort((a,b)=>b.n-a.n)}
function wordQ(w,lang,m){const pool=T(w.t).words.filter(x=>x[lang]);return {w,lang,m:m||pick(['listen','read']),opts:shuffle([w,...shuffle(pool.filter(x=>x!==w)).slice(0,3)]),missed:false,hinted:false,done:false,wrongIdx:[]}}
function mathQ(g,l){return Object.assign(genL(GAME(g),l),{m:'math',g,lvl:l,missed:false,hinted:false,done:false,hint:false,wrongIdx:[]})}

function startTest(){newLook();if(overLimit()){showRest();return}const qs=[];
  const tried=l=>BASE.filter(t=>t.words.some(w=>{const r=wstat(l,w);return r.c+r.w>0}));
  ['en','ms'].forEach(l=>{const ts=tried(l).length?tried(l):BASE.filter(t=>!t.yr&&!t.book&&!t.bm);const used=new Set();for(let k=0,tries=0;k<2&&tries<50;tries++){const t=pick(ts),w=pick(t.words),key=t.id+':'+(w.k||w.en);if(used.has(key))continue;used.add(key);qs.push(wordQ(w,l));k++}});
  const pk=(o,n)=>shuffle(Object.keys(o)).slice(0,n);shuffle(Object.keys(MG).filter(k=>!MG[k].yr)).slice(0,2).forEach(g=>qs.push(mathQ(g,rnd(1,2))));shuffle(Object.keys(SG).filter(k=>!SG[k].yr)).slice(0,2).forEach(g=>qs.push(mathQ(g,1)));shuffle(Object.keys(CG).filter(k=>!CG[k].yr)).slice(0,2).forEach(g=>qs.push(mathQ(g,1)));

/* ---------- 家长后台 parent dashboard (PIN only) ---------- */
const SNAME={en:'🔤 英文',ms:'🇲🇾 国文',math:'🔢 数学',sci:'🔬 科学',cn:'🀄 华文',world:'🌍 环游世界',map:'🗺️ 冒险地图',mist:'📒 错题本',test:'📝 小测',duel:'⚔️ 对战',other:'其他'};
const SUBCOL={en:'var(--s-en)',ms:'var(--s-ms)',math:'var(--s-math)',sci:'var(--s-sci)',cn:'var(--s-cn)',world:'var(--s-world)'};
function sessSubj(r){const t=r.topic||'';if(/^(math|sci|cn|world):/.test(t))return t.split(':')[0];if(t.startsWith('boss:'))return 'map';if(t==='mist'||t==='test'||t==='duel')return t;if(r.lang==='en'||r.lang==='ms')return r.lang;return 'other'}
const pct=(c,t)=>t?Math.round(c*100/t):null;
function kidWeek(k,off){const ks=weekKeys(off);let stars=0,mins=0,c=0,w=0,days=0;ks.forEach(d=>{const r=k.days[d];if(!r)return;if(r.stars>0||r.secs>0)days++;stars+=r.stars||0;mins+=r.secs?Math.round(r.secs/60):(r.mins||0);c+=r.correct||0;w+=r.wrong||0});return{ks,stars,mins,acc:pct(c,c+w),days}}
function adminStats(k){const A={};
  const dv=Object.values(k.days);A.days=dv.filter(d=>d.stars>0||d.secs>0).length;A.mins=dv.reduce((a,d)=>a+(d.secs?Math.round(d.secs/60):(d.mins||0)),0);
  const tc=dv.reduce((a,d)=>a+(d.correct||0),0),tw=dv.reduce((a,d)=>a+(d.wrong||0),0);A.acc=pct(tc,tc+tw);A.answers=tc+tw;
  const last=k.sessions.reduce((a,r)=>Math.max(a,r.t),0);A.last=last?new Date(last):null;
  // per subject accuracy
  A.subj=['en','ms','math','sci','cn','world'].map(s=>{let c=0,w=0,tried=0,mast=0;
    if(s==='en'||s==='ms')Object.entries(k.words).forEach(([key,r])=>{if(key.startsWith(s+':')){c+=r.c;w+=r.w;if(r.c+r.w)tried++;if(r.c>=MASTER)mast++}});
    else Object.values(k[s]||{}).forEach(r=>{c+=r.c;w+=r.w});return{s,c,w,n:c+w,acc:pct(c,c+w),tried,mast}});
  // items for strengths / weaknesses: word topics (per language) and each game
  const items=[];const tp={};Object.entries(k.words).forEach(([key,r])=>{const [l,t]=key.split(':');const id=l+':'+t;(tp[id]=tp[id]||{l,t,c:0,w:0});tp[id].c+=r.c;tp[id].w+=r.w});
  Object.values(tp).forEach(x=>{const t=T(x.t);if(t)items.push({name:SNAME[x.l]+' · '+t.zh,c:x.c,w:x.w})});
  ['math','sci','cn','world'].forEach(s=>Object.entries(k[s]||{}).forEach(([g,r])=>{const gm=GAME(g);if(gm)items.push({name:SNAME[s]+' · '+gm.zh,c:r.c,w:r.w})}));
  items.forEach(x=>{x.n=x.c+x.w;x.acc=pct(x.c,x.n)});const enough=items.filter(x=>x.n>=6);
  A.strong=enough.filter(x=>x.acc>=80).sort((a,b)=>b.acc-a.acc||b.n-a.n).slice(0,4);A.weak=enough.filter(x=>x.acc<80).sort((a,b)=>a.acc-b.acc).slice(0,4);
  // interests: what the child chooses to play, and when
  const ss=k.sessions;A.plays=ss.length;const by={};ss.forEach(r=>{const s=sessSubj(r);by[s]=by[s]||{n:0,sec:0};by[s].n++;by[s].sec+=r.sec||0});
  A.bySubj=Object.entries(by).map(([s,v])=>({s,n:v.n,sec:v.sec})).sort((a,b)=>b.n-a.n);
  const mc={};ss.forEach(r=>{const m=MODES[r.mode];if(m&&!['math','sci','review','boss'].includes(r.mode)){mc[r.mode]=(mc[r.mode]||0)+1}else if(/^(math|sci|cn|world):/.test(r.topic)){const g=GAME(r.topic.split(':')[1]);if(g){const key='g:'+r.topic.split(':')[1];mc[key]=(mc[key]||0)+1}}});
  A.fav=Object.entries(mc).map(([k2,n])=>{const g=k2.startsWith('g:')&&GAME(k2.slice(2));return{name:g?g.e+' '+g.zh:MODES[k2].e+' '+MODES[k2].zh,n}}).sort((a,b)=>b.n-a.n).slice(0,5);
  const hb=[['🌅 早上','5–12 点',5,12],['☀️ 下午','12–18 点',12,18],['🌙 晚上','18–22 点',18,22],['🦉 很晚','22 点以后',22,29]];
  A.hours=hb.map(([n,d,a,b])=>({n,d,c:ss.filter(r=>{let h=new Date(r.t).getHours();if(h<5)h+=24;return h>=a&&h<b}).length}));
  A.weeks=[5,4,3,2,1,0].map(o=>kidWeek(k,o));
  A.hard=Object.entries(k.words).filter(([,r])=>r.w>0&&r.c<MASTER).sort((a,b)=>(b[1].w-b[1].c)-(a[1].w-a[1].c)).slice(0,10).map(([key,r])=>{const [l,t,...e]=key.split(':');const w=WMAP[t+':'+e.join(':')];return w&&w[l]?{l,w,r}:null}).filter(Boolean);
  A.tests=(k.tests||[]).slice(-6);A.mist=Object.keys(k.mist.w).length+Object.values(k.mist.m).reduce((a,n)=>a+n,0);
  A.mastered=['en','ms'].map(l=>Object.entries(k.words).filter(([key,r])=>key.startsWith(l+':')&&r.c>=MASTER).length);
  return A}
function adminSummary(k,A){const top=A.bySubj.filter(x=>SUBCOL[x.s])[0],tot=A.bySubj.reduce((a,x)=>a+x.n,0),hr=A.hours.slice().sort((a,b)=>b.c-a.c)[0];

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function normSay(t){return String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z\s-]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function sayMatch(alts,word){const w=normSay(word);return alts.map(normSay).some(a=>a===w||(' '+a+' ').includes(' '+w+' ')||lev(a,w)<=Math.floor(w.length/4))}
let srBusy=false;
function startSay(){if(!SR){toast('这个浏览器不能听你说话，可以用「🎤 跟读」自己听听看');return}if(srBusy)return;const q=cur(),lg=q.lang||G.lang;
  try{speechSynthesis.cancel()}catch(e){}const r=new SR();r.lang=lg==='en'?'en-GB':'ms-MY';r.maxAlternatives=5;r.interimResults=false;srBusy=true;q.sayMsg='👂 Momo 在听……大声说出来！';render();
  r.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript);const ok=sayMatch(alts,q.w[lg]);
    q.sayMsg=ok?'✅ 说对了！Momo 听到：「'+esc(alts[0])+'」':'🤔 Momo 听到：「'+esc(alts[0]||'……')+'」，再听一次，跟着说说看～';
    if(ok){sGood();if(!q.saidOk){q.saidOk=true;const d=dayRec();d.say=(d.say||0)+1;addStars(1);touch()}burst(document.querySelector('.card'),'🗣️')}else sBad()};
  r.onerror=e=>{q.sayMsg=e.error==='not-allowed'||e.error==='service-not-allowed'?'请允许使用麦克风 🎤':'没有听到声音，再试一次吧～'};
  r.onend=()=>{srBusy=false;if(view.name==='game'&&G&&G.qs.includes(q))render()};
  try{r.start();setTimeout(()=>{if(srBusy){try{r.abort()}catch(e){}srBusy=false;if(view.name==='game'&&G&&G.qs.includes(q)){q.sayMsg='没有听到声音，再试一次吧～';render()}}},8000)}catch(e){srBusy=false;q.sayMsg='现在不能听，再试一次吧～';render()}}

function spellCheck(){
  const q=cur();if(q.slots.some(s=>!s.fixed&&!s.val))return;
  const ok=q.slots.every(s=>s.fixed||s.val===s.ch);
  if(ok)answer(true,document.getElementById('slots'));
  else{answer(false);const el=document.getElementById('slots');el.classList.add('shake');
    setTimeout(()=>{q.slots.forEach(s=>{if(!s.fixed&&s.val!==s.ch&&s.tile!=null){q.tiles.find(t=>t.id===s.tile).used=false;s.val=null;s.tile=null}});render()},450)}
}
function endGame(){
  const mins=Math.max(1,Math.round((Date.now()-G.start)/60000));
  if(G.mode==='learn'){addStars(3)}
  if(G.mode==='match'){addStars(G.moves<=8?6:G.moves<=11?5:G.moves<=14?4:3)}
  dayRec().mins+=mins;
  let pass=null;if(G.station!=null){pass=G.mode==='learn'||G.mode==='match'||G.score>=Math.ceil(G.qs.length*0.75);if(pass){const first=!adv().done[G.station];adv().done[G.station]=true;if(STATIONS[G.station].k==='boss'&&first)addStars(5)}}
  if(G.mode==='test'){S.tests.push({d:dk(),s:G.score,n:G.qs.length});S.tests=S.tests.slice(-30)}
  S.sessions.push({t:Date.now(),topic:G.topic,mode:G.mode,lang:G.lang,score:G.mode==='learn'?null:G.score,total:G.qs.length,sec:Math.round((Date.now()-G.start)/1000)});
  S.sessions=S.sessions.slice(-300);touch();
  const earned=S.stars-G.starsBefore;const newSt=STICKERS.filter(s=>s.n>G.starsBefore&&s.n<=S.stars);
  go({name:'end',earned,newSt,mode:G.mode,score:G.score,total:G.qs.length,best:G.best||0,moves:G.moves||0,station:G.station,pass,newCards:cardCount()-(G.cardsBefore||0)});

}

function weekKeys(off){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)-7*off);const ks=[];for(let i=0;i<7;i++){const x=new Date(d);x.setDate(d.getDate()+i);ks.push(dk(x))}return ks}
function weekSum(off){const ks=weekKeys(off);const w={days:0,stars:0,mins:0,correct:0,wrong:0,rec:0,mc:0,sc:0,cc:0,newWords:0,ks};
  ks.forEach(k=>{const r=S.days[k];if(r&&r.stars>0){w.days++;w.stars+=r.stars;w.mins+=r.mins||0;w.correct+=r.correct;w.wrong+=r.wrong;w.rec+=r.rec||0;w.mc+=r.mc||0;w.sc+=r.sc||0;w.cc+=r.cc||0}});
  w.newWords=Object.values(S.words).filter(r=>r.m&&ks.includes(r.m)).length;return w}
function weakTopic(){let best=null;TOPICS.forEach(t=>{let tried=0;t.words.forEach(w=>{const r=wstat(S.lang,w);if(r.c+r.w)tried++});if(!tried)return;
  const ratio=mastered(S.lang,t.id)/t.words.length;if(ratio<1&&(!best||ratio<best.ratio))best={t,ratio}});return best&&best.t}

      render();break}
    case 'pet':sTap();go({name:'pet'});break;
    case 'map':sTap();go({name:'map'});break;
    case 'album':sTap();go({name:'album'});break;
    case 'missions':sTap();go({name:'missions'});break;
    case 'duel':sTap();go({name:'duel',opp:D?D.opp:0,sub:D?D.sub:'en'});break;
    case 'station':startStation(+v);break;
    case 'locked':sBad();toast('先完成前面的关卡哦 🔒');break;
    case 'cardsay':{const w=WMAP[b.dataset.t+':'+v];if(!w)return;speak(w.en,'en');speak(w.ms,'ms',true);speak(w.zh,'zh',true);burst(b,'✨');break}
    case 'mdone':{const m=missionState();if(m.done.includes(+v))return;m.done.push(+v);addStars(2);touch();render();sGood();speak('太棒了！','zh');burst(document.querySelector('.mission.ok:last-of-type')||document.querySelector('.mission'),'🌟');break}
    case 'dopp':view.opp=+v;sTap();render();break;
    case 'dsub':view.sub=v;sTap();render();break;
    case 'dstart':if(view.name==='duelplay'){view.opp=D.opp;view.sub=D.sub}startDuel();break;
    case 'dsay':duelSay();break;
    case 'dquit':if(D&&!D.over&&!confirm('要结束对战吗？'))return;go({name:'duel',opp:D?D.opp:0,sub:D?D.sub:'en'});break;
    case 'dans':{const p=+b.dataset.p,i=+v,q=D.qs[D.i];if(D.done||D.lock[p])return;
      if(q.opts[i].v===q.ans){D.done=true;D.winner=p;D.sc[p]++;render();sGood();burst(document.querySelector('.dside.p'+p),'⚡');speak(q.ansText,q.ansLang);setTimeout(duelNext,1900)}
      else{D.lock[p]=true;sBad();if(D.lock[0]&&D.lock[1]){D.done=true;D.winner=null;render();speak(q.ansText,q.ansLang);setTimeout(duelNext,1900)}else render()}break}
    case 'limit':S.limit=+v;touch();render();break;
    case 'cl':needPin(()=>{const d=clDraft(v||((S.custom||[]).length?'':'new'));sTap();go({name:'custom',draft:d,bad:null});if(d){const el=document.getElementById(d.id==='new'?'cl-name':'cl-text');if(el)el.focus()}});break;
    case 'cllang':clKeep();view.draft.lang=v;sTap();render();break;
    case 'clcancel':go({name:'custom',draft:null});break;
    case 'clsave':clSave();break;
    case 'clplay':{const c=(S.custom||[]).find(x=>x.id===v);if(!c)return;S.subj='lang';S.lang=c.lang;touch();sTap();go({name:'topic',topic:'my-'+c.id});break}
    case 'cldel':{const c=(S.custom||[]).find(x=>x.id===v);if(!c)return;if(confirm('要删除词表「'+c.name+'」吗？')){S.custom=S.custom.filter(x=>x!==c);touch();toast('已删除');render()}break}
    case 'export':exportData();break;
    case 'world':S.subj='world';touch();sTap();go({name:'subject'});speak('我们去环游世界！','zh');break;
    case 'malware':sTap();openMalware();break;
    case 'mist':sTap();go({name:'mist'});break;
    case 'mistplay':startMist();break;
    case 'mistgame':{const [g,l]=v.split(':');startMath(g,+l);break}
    case 'test':sTap();go({name:'test'});break;
    case 'teststart':startTest();break;
    case 'print':go({name:'print',off:0});break;
    case 'printwk':go({name:'print',off:+v});break;
    case 'doprint':window.print();break;
    case 'letter':showLetter();break;
    case 'pinset':setPin();break;
    case 'admin':openAdmin();break;
    case 'adminkid':needPin(()=>go({name:'admin',kid:v}));break;
    case 'copyadmin':{const t=adminText(v);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('摘要已复制 📋'),()=>toast('复制不了，请手动截图'));break}
    case 'pinoff':if(confirm('要取消家长密码吗？')){delete ALL.pin;touch();toast('已取消密码');render()}break;
    case 'saycheck':startSay();break;
    case 'import':document.getElementById('imp').click();break;
    case 'pat':{const t=pick(MOMO_TALK),li=rnd(0,2);const el=document.getElementById('petsay');if(el)el.innerHTML=esc(t[2])+'<small>'+esc(li===2?t[0]:t[li])+'</small>';speak(t[li],['en','ms','zh'][li]);
      const m=document.querySelector('.room .momo');if(m){m.classList.remove('dance');void m.offsetWidth;m.classList.add('dance');setTimeout(()=>m.classList.remove('dance'),1500);burst(m,'💖')}break}
    case 'feed':{if((S.bamboo||0)<3)return;const p=pet();S.bamboo-=3;p.happy=Math.min(100,happyNow()+25);p.fed=Date.now();touch();render();sGood();speak('好吃！谢谢你！','zh');burst(document.querySelector('.room .momo'),'🎋');break}
    case 'buy':{const x=SHOP.find(i=>i.id===v),p=pet();if(!x||p.owned.includes(x.id))return;if((S.bamboo||0)<x.p){sBad();toast('竹子还不够哦，再去学习赚 '+(x.p-(S.bamboo||0))+' 根竹子吧 🎋');return}
      S.bamboo-=x.p;p.owned.push(x.id);if(x.slot==='bg')p.bg=x.id;else{p.wear=p.wear||{};p.wear[x.slot]=x.id}touch();render();sGood();toast('买到了 '+x.e+' '+x.zh+'！');burst(document.querySelector('.room .momo'),x.e);break}
    case 'wear':{const p=pet();if(v==='sky'||v.startsWith('bg-'))p.bg=v;else{const x=SHOP.find(i=>i.id===v);if(!x)return;p.wear=p.wear||{};p.wear[x.slot]=p.wear[x.slot]===x.id?null:x.id}touch();sTap();render();break}
    case 'mine':playMine();break;
    case 'compare':speakCur();setTimeout(playMine,1700);break;
    case 'kids':go({name:'kids'});break;
    case 'rate':VP.rate=+v;saveVP();render();speak('This is a cat.','en');break;
    case 'pickkid':ALL.cur=v;S=ALL.kids[v];touch();sGood();go({name:S.name?'home':'setup'});break;
    case 'addkid':go({name:'setup',newKid:true});break;
    case 'delkid':{if(Object.keys(ALL.kids).length<2)return;if(confirm('确定要删除 '+S.name+' 的全部资料吗？')&&confirm('真的确定吗？这个动作不能复原。')){delete ALL.kids[ALL.cur];ALL.cur=Object.keys(ALL.kids)[0];S=ALL.kids[ALL.cur];touch();toast('已删除');go({name:'home'})}break}
    case 'copyrep':{const t=reportText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('报告已复制，可以贴到 WhatsApp 📋'),()=>toast('复制不了，请手动截图保存'));break}
    case 'ans':{const q=cur(),i=+v;const ok=q.m==='math'?q.opts[i].v===q.ans:q.opts[i]===q.w;if(ok)answer(true,b);else{q.wrongIdx.push(i);answer(false);if(q.m==='bubble'){b.classList.add('popx')}else{b.classList.add('shake');setTimeout(render,400)}}break}
    case 'tile':{const q=cur(),t=q.tiles.find(x=>x.id===+v);const s=q.slots.find(x=>!x.fixed&&!x.val);if(!t||t.used||!s)return;
      t.used=true;s.val=t.ch;s.tile=t.id;sTap();render();spellCheck();break}
    case 'unslot':{const q=cur();if(q.done)return;const s=q.slots[+v];if(!s||!s.val)return;q.tiles.find(t=>t.id===s.tile).used=false;s.val=null;s.tile=null;render();break}
    case 'clear':{const q=cur();q.slots.forEach(s=>{if(!s.fixed){s.val=null;s.tile=null}});q.tiles.forEach(t=>t.used=false);render();break}
    case 'hint':{const q=cur();const i=q.slots.findIndex(s=>!s.fixed&&s.val!==s.ch);if(i<0)return;q.hinted=true;
      const s=q.slots[i];if(s.val){q.tiles.find(t=>t.id===s.tile).used=false;s.val=null;s.tile=null}
      const blk=q.slots.find((x,j)=>j!==i&&!x.fixed&&x.val===s.ch&&x.ch!==s.ch);if(blk){q.tiles.find(t=>t.id===blk.tile).used=false;blk.val=null;blk.tile=null}
      const t=q.tiles.find(t=>!t.used&&t.ch===s.ch);if(t){t.used=true;s.val=t.ch;s.tile=t.id}render();spellCheck();break}
    case 'next':if(G.i<G.qs.length-1){G.i++;setupTiles();render();const m=cur().m;if(m==='listen'||m==='sent'||m==='math'||m==='dict')setTimeout(speakCur,250)}else endGame();break;
    case 'quit':if(G&&G.qs.some(q=>q.done)&&!confirm('要离开吗？这一轮的进度不会保存成绩（已得的星星会保留）。'))return;G.station!=null?go({name:'map'}):isMG(G.mode)?go({name:'mtopic',game:G.game}):G.mode==='mist'||G.mode==='test'?go({name:G.mode}):G.topic==='review'?go({name:'subject'}):go({name:'topic',topic:G.topic});break;
    case 'again':G&&G.station!=null?startStation(G.station):isMG(view.mode)?startMath(G.game,G.level):view.mode==='mist'?startMist():view.mode==='test'?startTest():startGame(view.mode);break;
    case 'subj':S.subj=v||'math';touch();sTap();render();speak({sci:'我们来学科学！',cn:'我们来学华文！'}[S.subj]||'我们来学数学！','zh');break;
    case 'mtopic':sTap();go({name:'mtopic',game:v});break;
    case 'mplay':startMath(view.game,+v);break;
    case 'mhint':cur().hint=true;render();break;
    case 'fs':fsOff=!!fsEl();fsSet(!fsEl());break;
    case 'back':G.station!=null?go({name:'map'}):isMG(G.mode)?go({name:'mtopic',game:G.game}):G.mode==='mist'||G.mode==='test'?go({name:G.mode}):G.topic==='review'?go({name:'subject'}):go({name:'topic',topic:G.topic});break;
    case 'rename':{const n=(document.getElementById('nm2').value||'').trim();if(n){S.name=n;touch();toast('已保存 ✓');render()}break}
    case 'setava':S.avatar=v;touch();render();break;
    case 'goal':S.goal=+v;touch();render();break;
    case 'zh':S.showZh=!S.showZh;touch();render();break;
    case 'snd':S.sound=!S.sound;touch();render();break;
    case 'autolook':S.autoLook=S.autoLook===false;touch();sTap();render();break;
    case 'skin':S.skin=v;touch();render();sGood();break;
    case 'reset':if(confirm('确定要清除全部学习记录吗？星星、贴纸和成长记录都会归零。')&&confirm('真的确定吗？这个动作不能复原。')){const keep={name:S.name,avatar:S.avatar,custom:S.custom||[]};S=ALL.kids[ALL.cur]=Object.assign(blank(),keep);touch();toast('已清除');go({name:'home'})}break;
  }
});
app.addEventListener('change',e=>{const t=e.target;if(t.id==='imp'){importData(t.files&&t.files[0]);t.value='';return}if(t.classList&&t.classList.contains('vsel')){VP[t.dataset.l]=t.value;saveVP();speak({en:'Hello!',ms:'Selamat pagi!',zh:'你好！'}[t.dataset.l],t.dataset.l)}});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nm'){app.querySelector('[data-act="start"]').click();return}
  const t=e.target;if((e.key==='Enter'||e.key===' ')&&t.getAttribute&&t.getAttribute('role')==='button'&&t.dataset&&t.dataset.act&&t.tagName.toLowerCase()==='g'){e.preventDefault();t.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});

render();
setTimeout(initCloud,0);
/* offline: cache the app on GitHub Pages (needs https, or localhost for testing) */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
